<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YKW 3DS to Switch Save Converter</title>
  <meta name="description" content="Convert a Yo-kai Watch 1 Nintendo 3DS save for Nintendo Switch in your browser.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Yo-kai Watch 1<br><span>3DS → Switch</span></h1>
    <label class="drop" id="drop">
      <input id="file" type="file" accept=".yw,application/octet-stream">
      <strong id="fileLabel">Choose a 3DS save</strong>
      <small>Expected size: 38,624 bytes</small>
    </label>
    <button id="convert" disabled>Loading converter…</button>
    <p id="status" role="status">Preparing the local conversion engine.</p>
    <aside><strong>Back up your saves.</strong>
  </main>
  <footer>Runs locally with Pyodide • No server upload</footer>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
  <script src="app.js"></script>
</body>
</html>
